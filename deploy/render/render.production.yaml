# Living Portfolio Production Blueprint (§13.1, §19, OSR-22, ADR P003)
# Provider: Render (https://render.com)
# Environment: Production (deployed by immutable image digest with required reviewer, health gate, auto-rollback)
version: "1"

services:
  # Autonomous Frontend Web Service (apps/web)
  - type: web
    name: living-portfolio-web-prod
    env: docker
    dockerfilePath: docker/Dockerfile.web
    plan: standard
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_CLASS
        value: production
      - key: WEB_PORT
        value: 3001
      - key: PORT
        value: 3001
      - key: PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: living-portfolio-api-prod
          property: host
      - key: SITE_ORIGIN
        sync: false
      - key: PUBLIC_SITE_NAME
        value: The Living Portfolio

  # REST API Backend Service (apps/api)
  - type: web
    name: living-portfolio-api-prod
    env: docker
    dockerfilePath: docker/Dockerfile.api
    plan: standard
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_CLASS
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: living-portfolio-db-prod
          property: connectionString
      - key: SITE_ORIGIN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: REPOSITORY_STORAGE_DRIVER
        value: postgres

  # Asynchronous Background Worker Daemon (apps/worker)
  - type: worker
    name: living-portfolio-worker-prod
    env: docker
    dockerfilePath: docker/Dockerfile.worker
    plan: standard
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_CLASS
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: living-portfolio-db-prod
          property: connectionString

databases:
  # Managed PostgreSQL 16 with native pgvector extension
  - name: living-portfolio-db-prod
    databaseName: portfolio_production
    user: portfolio_production
    plan: standard
    region: oregon
    postgresMajorVersion: 16
