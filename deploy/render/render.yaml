# Living Portfolio Staging Blueprint (§13.1, OSR-18, ADR P003)
# Provider: Render (https://render.com)
# Environment: Staging (auto-deployed from main by image digest)
version: "1"

services:
  # Autonomous Frontend Web Service (apps/web)
  - type: web
    name: living-portfolio-web
    env: docker
    dockerfilePath: docker/Dockerfile.web
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_CLASS
        value: staging
      - key: WEB_PORT
        value: 3001
      - key: PORT
        value: 3001
      - key: PUBLIC_API_BASE_URL
        fromService:
          type: web
          name: living-portfolio-api
          property: host
      - key: SITE_ORIGIN
        value: https://living-portfolio-web.onrender.com
      - key: PUBLIC_SITE_NAME
        value: The Living Portfolio (Staging)

  # REST API Backend Service (apps/api)
  - type: web
    name: living-portfolio-api
    env: docker
    dockerfilePath: docker/Dockerfile.api
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_CLASS
        value: staging
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: living-portfolio-db
          property: connectionString
      - key: SITE_ORIGIN
        value: https://living-portfolio-web.onrender.com
      - key: JWT_SECRET
        generateValue: true
      - key: REPOSITORY_STORAGE_DRIVER
        value: postgres

  # Asynchronous Background Worker Daemon (apps/worker)
  - type: worker
    name: living-portfolio-worker
    env: docker
    dockerfilePath: docker/Dockerfile.worker
    plan: starter
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEPLOYMENT_CLASS
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: living-portfolio-db
          property: connectionString

databases:
  # Managed PostgreSQL 16 with native pgvector extension
  - name: living-portfolio-db
    databaseName: portfolio_staging
    user: portfolio_staging
    plan: standard
    region: oregon
    postgresMajorVersion: 16
