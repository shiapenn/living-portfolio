name: Backup & Scratch Restore Drill

on:
  schedule:
    - cron: '0 2 * * *' # Nightly at 02:00 UTC (§13.9, OSR-20)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/db/src/backup/**'
      - 'scripts/backup-db'
      - 'scripts/restore-drill'
      - 'scripts/seed-db'
      - 'package.json'
      - '.github/workflows/backup-restore-drill.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/db/src/backup/**'
      - 'scripts/backup-db'
      - 'scripts/restore-drill'
      - 'scripts/seed-db'
      - 'package.json'
      - '.github/workflows/backup-restore-drill.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backup-and-restore-drill:
    name: Nightly Automated Backup & Scratch Container Restore Drill (§13.9, §18.1, OSR-20, M8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: living_portfolio_prod
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      scratch-postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: living_portfolio_scratch
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/living_portfolio_prod
      SCRATCH_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5433/living_portfolio_scratch
      AGE_PUBLIC_KEY: lp_ci_age_recipient_pubkey_2026
      BACKUP_DIR: ${{ github.workspace }}/backups

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Run primary DB migration
        run: pnpm db:migrate

      - name: Run scratch DB migration
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5433/living_portfolio_scratch
        run: pnpm db:migrate

      - name: Seed demo portfolio data for verification
        run: pnpm seed:demo

      - name: Run automated pg_dump + age encrypted backup (§13.9, OSR-20)
        run: pnpm db:backup

      - name: Verify backup archive and metadata sidecar exist
        run: |
          test -d "$BACKUP_DIR"
          ARCHIVE_COUNT=$(find "$BACKUP_DIR" -name "*.dump.age" | wc -l)
          META_COUNT=$(find "$BACKUP_DIR" -name "*.meta.json" | wc -l)
          echo "Found $ARCHIVE_COUNT archive(s) and $META_COUNT metadata sidecar(s)."
          if [ "$ARCHIVE_COUNT" -eq 0 ] || [ "$META_COUNT" -eq 0 ]; then
            echo "ERROR: Backup archive or metadata missing."
            exit 1
          fi

      - name: Execute automated scratch container restore drill (§13.9, §18.1, OSR-20)
        run: pnpm db:restore-drill

      - name: Upload backup drill metadata artifact
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: backup-drill-metadata
          path: |
            ${{ github.workspace }}/backups/*.meta.json
          retention-days: 7
