name: CI & Audit Conformance Gate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    name: Detect Changed Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/changed-scope --base "$BASE_SHA" --head "$HEAD_SHA"

  ci-and-audit-gate:
    name: Typecheck, Unit, Security Regression, DCO & Audit Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: living_portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/living_portfolio_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/changed-scope --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (typecheck)
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm build

      - name: Verify .env.example is in sync with @living-portfolio/config (OSR-03)
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          node scripts/generate-env-example
          git diff --exit-code .env.example

      - name: Run Hard-Code Inventory Scanner (OSR-01)
        run: node scripts/hardcode-check

      - name: Run UI Contract & Size-Budget Guard Check (WP-15.6, D-CONTRACT-5)
        run: node scripts/verify-ui-guards

      - name: Verify every pinned action SHA resolves upstream (CI fix 3a)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-action-pins

      - name: Verify Developer Certificate of Origin sign-off on every commit in range (OSR-07 dco, CI fix 3c)
        env:
          DCO_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DCO_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/dco-check

      - name: Run Audit Governance & Conformance Check (DR-AUD-001 AUD-21)
        run: pnpm audit:check

      - name: Run Receipt Online Gate on Docs Changes
        run: node scripts/receipt-check

      - name: Run Unit, Conformance & P0 Regression Suites (AUD-14, AUD-15, D.1, D.2)
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm test

      - name: Verify Software Bill of Materials (SBOM) Generation (OSR-16)
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          node scripts/generate-sbom sbom.spdx.json
          test -s sbom.spdx.json
          rm -f sbom.spdx.json

      - name: Validate Docker Compose Configuration Syntax (OSR-16)
        if: steps.changes.outputs.docs_only != 'true'
        run: docker compose -f docker/docker-compose.hobbyist.yml config

      - name: Run Documentation Conformance Tests on Docs Changes
        if: steps.changes.outputs.docs_only == 'true'
        run: pnpm --filter @living-portfolio/api test src/conformance/docs-identity.conformance.test.ts src/conformance/receipt-check.conformance.test.ts src/conformance/handover.conformance.test.ts src/conformance/changed-scope.conformance.test.ts

  playwright-e2e:
    name: Playwright End-to-End Suite
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium with system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Build packages
        run: pnpm build

      - name: Run Playwright E2E Tests
        run: pnpm test:e2e

      - name: Upload Playwright Report & Traces on Failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
