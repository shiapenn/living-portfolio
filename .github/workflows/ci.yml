name: CI & Audit Conformance Gate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_census:
        description: "Run full STATES census across all 42 states"
        type: boolean
        default: true
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    name: Detect Changed Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      census_states: ${{ steps.states.outputs.census_states }}
      census_mode: ${{ steps.states.outputs.census_mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            node scripts/changed-scope --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

      - name: Map changed files to STATES census subset
        id: states
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CENSUS_FULL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full_census != false) || github.event_name == 'schedule' && '1' || '0' }}
        run: |
          node scripts/changed-states --base "$BASE_SHA" --head "$HEAD_SHA"

  build-artifact:
    name: Build Shared Artifact
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Upload built dist artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: workspace-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            packages/*/dist/
            apps/*/dist/
          retention-days: 1

  ci-and-audit-gate:
    name: Typecheck, Unit, Security Regression, DCO & Audit Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: living_portfolio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/living_portfolio_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            node scripts/changed-scope --base "$BASE_SHA" --head "$HEAD_SHA"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages (typecheck)
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm build

      - name: Verify .env.example is in sync with @living-portfolio/config (OSR-03)
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          node scripts/generate-env-example
          git diff --exit-code .env.example

      - name: Run Hard-Code Inventory Scanner (OSR-01)
        run: node scripts/hardcode-check

      - name: Run UI Contract & Size-Budget Guard Check (WP-15.6, D-CONTRACT-5)
        run: node scripts/verify-ui-guards

      - name: Run Design System Boundary, Namespace & Drift Guard (WP-16.M D-M1/D-M6)
        run: node scripts/verify-design-boundaries && node scripts/generate-registry --check

      - name: Verify every pinned action SHA resolves upstream (CI fix 3a)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-action-pins

      - name: Verify Developer Certificate of Origin sign-off on every commit in range (OSR-07 dco, CI fix 3c)
        env:
          DCO_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          DCO_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/dco-check

      - name: Run Audit Governance & Conformance Check (DR-AUD-001 AUD-21)
        run: pnpm audit:check

      - name: Run Receipt Online Gate on Docs Changes
        run: node scripts/receipt-check

      - name: Run Unit, Conformance & P0 Regression Suites (AUD-14, AUD-15, D.1, D.2)
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm test

      - name: Verify Software Bill of Materials (SBOM) Generation (OSR-16)
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          node scripts/generate-sbom sbom.spdx.json
          test -s sbom.spdx.json
          rm -f sbom.spdx.json

      - name: Validate Docker Compose Configuration Syntax (OSR-16)
        if: steps.changes.outputs.docs_only != 'true'
        run: docker compose -f docker/docker-compose.hobbyist.yml config

      - name: Run Documentation Conformance Tests on Docs Changes
        if: steps.changes.outputs.docs_only == 'true'
        run: pnpm --filter @living-portfolio/api test src/conformance/docs-identity.conformance.test.ts src/conformance/receipt-check.conformance.test.ts src/conformance/handover.conformance.test.ts src/conformance/changed-scope.conformance.test.ts

  playwright-e2e-shard:
    name: Playwright E2E Shard ${{ matrix.shard }}/4
    needs: [detect-changes, build-artifact]
    if: ${{ needs.detect-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.14.0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download built dist artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          name: workspace-dist-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Cache Playwright Chromium browser
        id: pw-cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright Chromium system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run Playwright E2E Tests (shard ${{ matrix.shard }}/4)
        env:
          CENSUS_STATES: ${{ needs.detect-changes.outputs.census_states }}
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright Report & Traces on Failure
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: ${{ failure() }}
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  playwright-e2e:
    name: Playwright End-to-End Suite
    needs: [detect-changes, playwright-e2e-shard]
    if: ${{ always() && !cancelled() && needs.detect-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all Playwright shards passed
        run: |
          if [ "${{ needs.playwright-e2e-shard.result }}" != "success" ]; then
            echo "One or more Playwright E2E shards failed (result=${{ needs.playwright-e2e-shard.result }})."
            exit 1
          fi
          echo "All 4 Playwright E2E shards passed (census_mode=${{ needs.detect-changes.outputs.census_mode }})."
