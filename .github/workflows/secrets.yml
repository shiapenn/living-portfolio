name: Secret Scan (gitleaks)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks Secret & Credential Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks with Checksum Verification
        run: |
          mkdir -p "${{ runner.temp }}/bin"
          curl -sSL -o "${{ runner.temp }}/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          EXPECTED_SHA=$(node -e 'const c = JSON.parse(require("fs").readFileSync("scripts/gitleaks-checksums.json", "utf8")); console.log(c[process.env.GITLEAKS_VERSION]["linux_x64"]);')
          ACTUAL_SHA=$(sha256sum "${{ runner.temp }}/gitleaks.tar.gz" | awk '{print $1}')
          if [ "$EXPECTED_SHA" != "$ACTUAL_SHA" ]; then
            echo "Checksum mismatch for Gitleaks binary: expected $EXPECTED_SHA, got $ACTUAL_SHA"
            exit 1
          fi
          echo "Verified Gitleaks binary SHA256: $ACTUAL_SHA"
          tar -xzf "${{ runner.temp }}/gitleaks.tar.gz" -C "${{ runner.temp }}/bin" gitleaks
          rm -f "${{ runner.temp }}/gitleaks.tar.gz"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"
          echo "Installed Gitleaks version: $("${{ runner.temp }}/bin/gitleaks" version)"

      - name: Run Hardened Gitleaks Scan (Full History on Push / PR Range on Pull Request)
        env:
          DCO_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          DCO_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: node scripts/gitleaks-scan
