name: Secret Scan (gitleaks)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  secret-scan:
    name: Gitleaks Secret & Credential Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install Gitleaks with Checksum Verification
        run: |
          mkdir -p "${{ runner.temp }}/bin"
          URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          ARCHIVE="${{ runner.temp }}/gitleaks.tar.gz"
          EXPECTED_SHA=$(node -e 'const c = JSON.parse(require("fs").readFileSync("scripts/gitleaks-checksums.json", "utf8")); console.log(c[process.env.GITLEAKS_VERSION]["linux_x64"]);')
          
          SUCCESS=0
          for attempt in 1 2 3 4 5; do
            echo "Downloading Gitleaks binary (attempt $attempt)..."
            if curl -sSL --retry 3 --retry-delay 2 --retry-connrefused -o "$ARCHIVE" "$URL"; then
              ACTUAL_SHA=$(sha256sum "$ARCHIVE" | awk '{print $1}')
              if [ "$EXPECTED_SHA" = "$ACTUAL_SHA" ]; then
                echo "Verified Gitleaks binary SHA256: $ACTUAL_SHA"
                SUCCESS=1
                break
              else
                echo "Checksum mismatch on attempt $attempt: expected $EXPECTED_SHA, got $ACTUAL_SHA"
              fi
            else
              echo "Download failed on attempt $attempt."
            fi
            sleep $((attempt * 2))
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "Failed to download verified Gitleaks binary after 5 attempts."
            exit 1
          fi

          tar -xzf "$ARCHIVE" -C "${{ runner.temp }}/bin" gitleaks
          rm -f "$ARCHIVE"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"
          echo "Installed Gitleaks version: $("${{ runner.temp }}/bin/gitleaks" version)"

      - name: Run Hardened Gitleaks Scan (Full History on Push / PR Range on Pull Request)
        env:
          DCO_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          DCO_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: node scripts/gitleaks-scan
