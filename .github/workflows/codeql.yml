name: CodeQL Static Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: CodeQL (JavaScript / TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/changed-scope --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Fast-pass CodeQL on docs-only changes
        if: steps.changes.outputs.docs_only == 'true'
        run: echo "✓ [SARIF-GATE] Docs-only change detected; CodeQL analysis skipped (baseline unchanged)."

      - name: Download CodeQL Bundle with Retry
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          URL="https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.20.0/codeql-bundle-linux64.tar.zst"
          DEST="${{ runner.temp }}/codeql-bundle-linux64.tar.zst"
          SUCCESS=0
          for attempt in 1 2 3 4 5; do
            echo "Downloading CodeQL bundle (attempt $attempt)..."
            if curl -fL --retry 3 --retry-delay 2 --retry-connrefused -o "$DEST" "$URL"; then
              echo "CodeQL bundle downloaded successfully."
              SUCCESS=1
              break
            fi
            echo "Download failed on attempt $attempt. Backing off..."
            sleep $((attempt * 3))
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "Failed to download CodeQL bundle after 5 attempts."
            exit 1
          fi

      - name: Initialize CodeQL
        if: steps.changes.outputs.docs_only != 'true'
        uses: github/codeql-action/init@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          languages: javascript-typescript
          tools: ${{ runner.temp }}/codeql-bundle-linux64.tar.zst

      - name: Perform CodeQL Analysis
        if: steps.changes.outputs.docs_only != 'true'
        uses: github/codeql-action/analyze@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          upload: "never"
          output: "${{ runner.temp }}/codeql-results"

      - name: Run SARIF Gate
        if: steps.changes.outputs.docs_only != 'true'
        run: node scripts/sarif-gate "${{ runner.temp }}/codeql-results"

      - name: Upload SARIF as Artifact
        if: ${{ always() && steps.changes.outputs.docs_only != 'true' }}
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: codeql-sarif
          path: "${{ runner.temp }}/codeql-results"
          if-no-files-found: warn

      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ vars.CODEQL_UPLOAD == 'true' && steps.changes.outputs.docs_only != 'true' }}
        uses: github/codeql-action/upload-sarif@48ab28a6f5dbc2a99bf1e0131198dd8f1df78169 # v3.28.0
        with:
          sarif_file: "${{ runner.temp }}/codeql-results"
