name: CodeQL Static Analysis

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: CodeQL (JavaScript / TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download CodeQL Bundle with Retry
        run: |
          URL="https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.20.0/codeql-bundle-linux64.tar.zst"
          DEST="${{ runner.temp }}/codeql-bundle-linux64.tar.zst"
          SUCCESS=0
          for attempt in 1 2 3 4 5; do
            echo "Downloading CodeQL bundle (attempt $attempt)..."
            if curl -fL --retry 3 --retry-delay 2 --retry-connrefused -o "$DEST" "$URL"; then
              echo "CodeQL bundle downloaded successfully."
              SUCCESS=1
              break
            fi
            echo "Download failed on attempt $attempt. Backing off..."
            sleep $((attempt * 3))
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "Failed to download CodeQL bundle after 5 attempts."
            exit 1
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          tools: ${{ runner.temp }}/codeql-bundle-linux64.tar.zst

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          upload: "never"
          output: "${{ runner.temp }}/codeql-results"

      - name: Run SARIF Gate
        run: node scripts/sarif-gate "${{ runner.temp }}/codeql-results"

      - name: Upload SARIF as Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: "${{ runner.temp }}/codeql-results"
          if-no-files-found: warn

      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ vars.CODEQL_UPLOAD == 'true' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: "${{ runner.temp }}/codeql-results"
