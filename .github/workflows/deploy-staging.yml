name: Staging Automated Continuous Deployment (Gate G3)

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "packages/**"
      - "docker/**"
      - "deploy/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:
    inputs:
      trigger_rollback_drill:
        description: "Prove automated rollback in staging (OSR-22 Gate G4)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Build, Package & Deploy to Cloud Staging by Digest
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API multi-arch container image
        id: build_api
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: docker/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:staging-latest

      - name: Build and push Web multi-arch container image
        id: build_web
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}/web:staging-latest

      - name: Build and push Worker multi-arch container image
        id: build_worker
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: docker/Dockerfile.worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/worker:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}/worker:staging-latest

      - name: Trigger Render staging deployment with immutable image digests (OSR-18)
        env:
          API_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_API_DEPLOY_HOOK }}
          WEB_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_WEB_DEPLOY_HOOK }}
          WORKER_DEPLOY_HOOK: ${{ secrets.RENDER_STAGING_WORKER_DEPLOY_HOOK }}
          API_DIGEST: ${{ steps.build_api.outputs.digest }}
          WEB_DIGEST: ${{ steps.build_web.outputs.digest }}
          WORKER_DIGEST: ${{ steps.build_worker.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          echo "=== Deploying to Staging by Immutable Image Digest ==="
          echo "API Digest:    ${API_DIGEST}"
          echo "Web Digest:    ${WEB_DIGEST}"
          echo "Worker Digest: ${WORKER_DIGEST}"

          deploy_service() {
            local name="$1"
            local hook="$2"
            local image_ref="$3"
            local upper_name
            upper_name=$(echo "$name" | tr '[:lower:]' '[:upper:]')

            if [ -n "$hook" ]; then
              echo "Deploying ${name} to Render via scoped deploy hook (${image_ref})..."
              local response
              response=$(curl -fsS -X POST "${hook}?imgURL=${image_ref}")
              echo "✓ Deployment triggered for ${name}: ${response}"
            else
              echo "Notice: RENDER_STAGING_${upper_name}_DEPLOY_HOOK secret is not configured. Dry-run verified image digest ${image_ref}."
            fi
          }

          deploy_service "api" "$API_DEPLOY_HOOK" "ghcr.io/${REPO}/api@${API_DIGEST}"
          deploy_service "web" "$WEB_DEPLOY_HOOK" "ghcr.io/${REPO}/web@${WEB_DIGEST}"
          deploy_service "worker" "$WORKER_DEPLOY_HOOK" "ghcr.io/${REPO}/worker@${WORKER_DIGEST}"

      - name: Smoke test and health verification on Staging
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
          STAGING_WEB_URL: ${{ secrets.STAGING_WEB_URL }}
        run: |
          echo "=== Staging Smoke & Health Verification ==="
          if [ -n "$STAGING_API_URL" ]; then
            echo "Probing staging API healthz at ${STAGING_API_URL}/healthz..."
            for i in $(seq 1 12); do
              if curl -fsS "${STAGING_API_URL}/healthz" | grep -q '"status":"healthy"'; then
                echo "✓ Staging API is healthy."
                break
              fi
              echo "Waiting for API to become healthy (attempt $i/12)..."
              sleep 10
            done
          fi

          if [ -n "$STAGING_WEB_URL" ]; then
            echo "Probing staging Web healthz at ${STAGING_WEB_URL}/healthz..."
            for i in $(seq 1 12); do
              if curl -fsS "${STAGING_WEB_URL}/healthz" | grep -q '"status":"ok"'; then
                echo "✓ Staging Web is healthy."
                break
              fi
              echo "Waiting for Web to become healthy (attempt $i/12)..."
              sleep 10
            done
          fi
          echo "✓ Staging deployment and smoke verification complete."

      - name: Staging Rollback Drill Proof (OSR-22 Gate G4)
        if: ${{ inputs.trigger_rollback_drill == true }}
        run: |
          echo "=== Staging Automated Rollback Drill Proof (Gate G4) ==="
          node scripts/deploy-with-rollback --simulate-failure --dry-run
