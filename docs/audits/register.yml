- id: 20261106-UX-49
  audit: AUD-2026-11-06
  title: 'Setup wizard dead end if browser closed between account creation and TOTP confirmation'
  spec_sections:
    - "13.1"
    - "17"
  severity: P1
  status: open
  owner: A
  links:
    issue: null
    pr: null
    plan: docs/plans/P004-ux-remediation-work-packages.md
  regression_test: null
  history:
    - date: 2026-11-08
      status: open
      note: "Registered in WP-13.14: In-memory mode vs Postgres behavior when browser closes after account creation (Step 1) but before TOTP confirmation (Step 2). While server runs in memory, `hasAccount()` is true but `totpConfirmed` is false (`isSetupCompleted()` false); visiting /admin/setup shows Step 1 again, but resubmission throws 409 Conflict ('Admin account already configured') while TOTP secret/QR code is unrecoverable. In-memory mode recovers if process is restarted (memory wiped). In Postgres / persistent mode (auth-state.json persisted), restarting the server preserves `totpConfirmed: false`, leaving the owner permanently dead-ended (login redirects to setup, setup rejects account creation) without manual filesystem or DB deletion. Planned under WP-17."
  verified_by: null
