    - date: 2026-11-13
      status: fixed
      note: "Fixed in WP-14.8 (Task 0): Bound redactionPreviewToken payload strictly to exact entryId (no draft wildcard bypass across saved vs new entries), added unique jti nonce and single-use consumption tracking in AuthManager.verifyRedactionPreviewToken, and verified (a) payload fields (jti, entryId, bodyHash, scanHash, warningCount, exp), (b) rejection across body mismatch, different entryId, expiry, and unpublish->edit->publish, and (c) single-use non-reusability after publish in apps/api/src/conformance/wp14-7-publish-scan-and-unlisted.conformance.test.ts."
