  history:
    - date: 2026-11-10
      status: open
      note: "Registered after owner Gate G14 walkthrough: Editor action bar renders two Publish buttons side by side (#btn-publish-entry 'Publish' and #btn-open-publish-dialog 'Publish…'), creating competing primary actions (violating D-UI-1) and a potential bypass of the private-detail scan on PUT /api/entries/:id. Treated as P0 until server-side enforcement across every publish path (POST, PUT, Undo) is verified and the duplicate button is removed in WP-14.7."
    - date: 2026-11-13
      status: fixed
      note: "Fixed in WP-14.7 (A089, PR #113, commit 4dc9b32) and confirmed in owner Gate G14 retest on main: Removed duplicate #btn-publish-entry button and silent background scan in ensureRedactionToken() so #btn-open-publish-dialog ('Publish…') is the single publish path; stopped POST /api/entries from minting redactionPreviewToken on draft/unlisted creation; enforced verifyRedactionPreviewToken and nda_confirmed on POST /api/entries, PUT /api/entries/:id, and public POST /api/entries/:id/revisions; and ordered revision creation before PUT on draft-to-public transitions. Verified in apps/api/src/conformance/wp14-7-publish-scan-and-unlisted.conformance.test.ts and tests/e2e/wp14-7-hotfix.spec.ts."
    - date: 2026-11-13
      status: partial
